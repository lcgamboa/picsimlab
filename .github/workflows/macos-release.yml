name: macOS build

on:
  workflow_run:
    workflows: ["Linux release"]
    types: [completed]

jobs:
  buildMacOS:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-26
          - macos-26-intel

    steps:
      - name: Job info
        run: |
          echo "GitHub Ref: ${{ github.ref }}"
          echo "Event: ${{ github.event }}"

      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Set DESTDIR
        run: echo "DESTDIR=${{ github.workspace }}/staging" >> $GITHUB_ENV

      - name: Build and install
        run: bscripts/build_all_and_install_macos.sh

      - name: Build dmg
        run: bscripts/make_macos_bundle_and_dmg.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: picsimlab_pkg-${{ matrix.os }}
          path: release*/*

      - name: Latest code build release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/master' 
        with:
          prerelease: true
          files: release_*/*
          tag_name: latestbuild
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: (startsWith(github.ref, 'refs/tags/')) 
        name: tagged release
        uses: softprops/action-gh-release@v1
        with:
          files: release_*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


